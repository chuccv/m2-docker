services:
  xhgui-extended:
    # https://hub.docker.com/r/xhgui/xhgui/tags
    build:
      dockerfile_inline: |
        FROM xhgui/xhgui:0.23.2
        RUN echo 'memory_limit=512M' >> $$PHP_INI_DIR/conf.d/99-memory-limit.ini
    container_name: ddev-${DDEV_SITENAME}-xhgui-extended
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: always
    volumes:
      - ./xhgui-extended/nginx.conf:/etc/nginx/http.d/default.conf:ro
      - ./xhgui-extended/config.php:/var/www/xhgui/config/config.php
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTP_EXPOSE=8243:80
      - HTTPS_EXPOSE=8242:80
      - XHGUI_SAVE_HANDLER=pdo
      - DDEV_DATABASE_FAMILY=${DDEV_DATABASE_FAMILY}
      - XHGUI_PDO_USER=db
      - XHGUI_PDO_PASS=db
      - XHGUI_PDO_DSN_DBNAME=xhgui_extended
    links:
      - db
    depends_on:
      - db
