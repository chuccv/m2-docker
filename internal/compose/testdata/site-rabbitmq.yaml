services:
  db:
    image: mariadb:10.6
    container_name: ddev-ee249-qa-db
    restart: "no"
    user: 1000:1000
    environment:
      - MARIADB_USER=db
      - MARIADB_PASSWORD=db
      - MARIADB_DATABASE=db
      - MARIADB_ROOT_PASSWORD=root
    volumes:
      - ee249-qa-mariadb:/var/lib/mysql:nocopy
    labels:
      com.md.managed: "true"
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ddev-ee249-qa-rabbitmq
    hostname: rabbitmq
    restart: "no"
    environment:
      - RABBITMQ_DEFAULT_USER=magento
      - RABBITMQ_DEFAULT_PASS=pa$$s
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    labels:
      com.md.managed: "true"
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      retries: 30
      start_period: 10s
  redis:
    image: redis:7
    container_name: ddev-ee249-qa-redis
    restart: "no"
    volumes:
      - ddev-ee249-qa_redis:/data
    labels:
      com.md.managed: "true"
  web:
    image: md/php:8.5
    container_name: ddev-ee249-qa-web
    restart: "no"
    user: 1000:1000
    volumes:
      - /var/www/html/ee249-qa:/var/www/html
      - md-node-24:/opt/node:ro
      - /home/user/.md/ca/rootCA.pem:/usr/local/share/ca-certificates/md.crt:ro
      - /home/user/.md/sites/ee249-qa/nginx-run.conf:/etc/nginx/md-run.conf:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      com.md.managed: "true"
volumes:
  ddev-ee249-qa_redis:
    external: true
  ee249-qa-mariadb:
    external: true
  md-node-24:
    external: true
  rabbitmq:
    name: ee249-qa-rabbitmq
