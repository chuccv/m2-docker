services:
  md-opensearch-3.0.0:
    image: opensearchproject/opensearch:3.0.0
    entrypoint:
      - sh
      - -c
      - for p in analysis-icu analysis-phonetic; do ./bin/opensearch-plugin list | grep -qx $$p || ./bin/opensearch-plugin install --batch $$p; done; exec ./opensearch-docker-entrypoint.sh opensearch
    container_name: md-opensearch-3.0.0
    restart: "no"
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms768m -Xmx768m
    volumes:
      - md-opensearch-3.0.0-data:/usr/share/opensearch/data
      - md-opensearch-3.0.0-plugins:/usr/share/opensearch/plugins
    networks:
      - md
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1
      interval: 5s
      retries: 60
      start_period: 10s
  md-opensearch-latest:
    image: opensearchproject/opensearch:latest
    entrypoint:
      - sh
      - -c
      - for p in analysis-icu analysis-phonetic; do ./bin/opensearch-plugin list | grep -qx $$p || ./bin/opensearch-plugin install --batch $$p; done; exec ./opensearch-docker-entrypoint.sh opensearch
    container_name: md-opensearch-latest
    restart: "no"
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms768m -Xmx768m
    volumes:
      - md-opensearch-latest-data:/usr/share/opensearch/data
      - md-opensearch-latest-plugins:/usr/share/opensearch/plugins
    networks:
      - md
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs 'localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1
      interval: 5s
      retries: 60
      start_period: 10s
  md-router:
    image: traefik:v3.3
    container_name: md-router
    restart: "no"
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:9080
      - --entrypoints.websecure.address=:9443
      - --entrypoints.mailpit.address=:9025
      - --entrypoints.mailpit-secure.address=:9026
      - --entrypoints.xhgui.address=:9143
      - --entrypoints.xhgui-secure.address=:9142
      - --entrypoints.phpmyadmin.address=:9036
      - --entrypoints.phpmyadmin-secure.address=:9037
    ports:
      - 127.0.0.1:9080:9080
      - 127.0.0.1:9443:9443
      - 127.0.0.1:9025:9025
      - 127.0.0.1:9026:9026
      - 127.0.0.1:9143:9143
      - 127.0.0.1:9142:9142
      - 127.0.0.1:9036:9036
      - 127.0.0.1:9037:9037
    volumes:
      - /home/user/.md/router/dynamic:/etc/traefik/dynamic
      - /home/user/.md/certs:/certs:ro
    networks:
      - md
  md-xhgui:
    image: ddev/ddev-xhgui:v1.25.2
    container_name: md-xhgui
    restart: "no"
    command:
      - sh
      - -c
      - chown www-data /data && nginx -g 'pid /dev/shm/nginx.pid;' && exec php-fpm
    volumes:
      - md-xhgui-data:/data
      - /home/user/.md/shared/xhgui-config.php:/var/www/xhgui/config/config.php:ro
    extra_hosts:
      - xhgui:127.0.0.1
    networks:
      - md
networks:
  md:
    name: md
volumes:
  md-opensearch-3.0.0-data: {}
  md-opensearch-3.0.0-plugins: {}
  md-opensearch-latest-data: {}
  md-opensearch-latest-plugins: {}
  md-xhgui-data: {}
