services:
  db:
    image: mariadb:11.4
    container_name: ddev-pfsm248-db
    restart: unless-stopped
    user: 1000:1000
    environment:
      - MARIADB_USER=db
      - MARIADB_PASSWORD=db
      - MARIADB_DATABASE=db
    volumes:
      - pfsm248-mariadb:/var/lib/mysql
    labels:
      com.md.managed: "true"
  web:
    image: md/php:8.4
    container_name: ddev-pfsm248-web
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - /var/www/html/pfsm248:/var/www/html
      - md-node-24:/opt/node:ro
      - /home/neil/.md/ca/rootCA.pem:/usr/local/share/ca-certificates/md.crt:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      com.md.managed: "true"
volumes:
  md-node-24:
    external: true
  pfsm248-mariadb:
    external: true
