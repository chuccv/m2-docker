services:
  db:
    image: mariadb:10.6
    container_name: ddev-ee249-qa-db
    restart: "no"
    user: 1000:1000
    environment:
      - MARIADB_USER=db
      - MARIADB_PASSWORD=db
      - MARIADB_DATABASE=db
      - MARIADB_ROOT_PASSWORD=root
    volumes:
      - ee249-qa-mariadb:/var/lib/mysql:nocopy
    labels:
      com.md.managed: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 --silent || mysqladmin ping -h 127.0.0.1 --silent
      interval: 2s
      retries: 300
      start_period: 5s
  phpmyadmin:
    image: phpmyadmin:5
    container_name: ddev-ee249-qa-phpmyadmin
    restart: "no"
    depends_on:
      - db
    environment:
      - PMA_HOST=db
      - PMA_USER=db
      - PMA_PASSWORD=db
      - UPLOAD_LIMIT=1G
    labels:
      com.md.managed: "true"
  redis:
    image: redis:7
    container_name: ddev-ee249-qa-redis
    restart: "no"
    volumes:
      - ddev-ee249-qa_redis:/data
    labels:
      com.md.managed: "true"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 2s
      retries: 30
      start_period: 2s
  web:
    image: md/php:8.5
    container_name: ddev-ee249-qa-web
    restart: "no"
    user: 1000:1000
    volumes:
      - /var/www/html/ee249-qa:/var/www/html
      - md-node-24:/opt/node:ro
      - /home/user/.md/ca/rootCA.pem:/usr/local/share/ca-certificates/md.crt:ro
      - /home/user/.md/sites/ee249-qa/nginx-run.conf:/etc/nginx/md-run.conf:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      com.md.managed: "true"
volumes:
  ddev-ee249-qa_redis:
    external: true
  ee249-qa-mariadb:
    external: true
  md-node-24:
    external: true
